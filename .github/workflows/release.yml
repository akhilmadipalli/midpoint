name: Release

# Push a tag like v0.4.0 (matching the VERSION file) to build and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION
        run: |
          if [ "v$(cat VERSION)" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1
          fi
      - name: Build and package
        run: ./build.sh --release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="$(cat VERSION)" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "Midpoint $(cat VERSION)" --notes "$notes

          **Install:** \`brew install --cask akhilmadipalli/tap/midpoint\`, or download **Midpoint.dmg** below.
          See the [README](https://github.com/${{ github.repository }}#install) for other options."

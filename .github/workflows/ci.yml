name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build universal app and packages
        run: ./build.sh --release
      - name: Check scripts
        run: bash -n scripts/install.sh
      - name: Verify app bundle
        run: |
          lipo -archs build/Midpoint.app/Contents/MacOS/Midpoint | grep -q arm64
          lipo -archs build/Midpoint.app/Contents/MacOS/Midpoint | grep -q x86_64
          codesign --verify --verbose build/Midpoint.app
      - uses: actions/upload-artifact@v4
        with:
          name: Midpoint-${{ github.sha }}
          path: dist/Midpoint.zip
